# Actions-minutes policy (owner decision, ADR-036): every pull request and every push to main runs this
# `unit` matrix only (Ubuntu/Windows/macOS x Python 3.9/3.11; no model download, no network beyond pip).
# The heavy jobs live in heavy-tests.yml and stay manual (`workflow_dispatch`): `integration` downloads
# faster-whisper `base` and `engines` pulls speech.cpp and its models. A newer push to the same ref cancels
# the older run.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11"]
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build; keep 3.9 on the newest image that does
    runs-on: ${{ matrix.python == '3.9' && startsWith(matrix.os, 'ubuntu') && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: pip install -e .
      # diarization-skill owns the speaker-id rule; its published conformance fixtures are vendored under
      # tests/fixtures/speaker_id_conformance/ and must equal its main branch, so a fixture change there fails here
      # until it is taken (ADR-046). Read-only checkout, the same way diarization-skill's CI checks out its siblings.
      - uses: actions/checkout@v7
        with:
          repository: kajisho5/diarization-skill
          path: diarization-skill
      - name: Point the speaker-id conformance test at diarization-skill
        shell: bash
        run: |
          echo "DIARIZATION_SKILL_DIR=$GITHUB_WORKSPACE/diarization-skill" >> "$GITHUB_ENV"
          echo "TRANSCRIPTION_REQUIRE_DIARIZATION_FIXTURES=1" >> "$GITHUB_ENV"
      # one job also installs the optional [ja] extra (SudachiPy + SudachiDict core, ~75 MB, no model) so the
      # dictionary word segmentation tests run against the real tokenizer there; TRANSCRIPTION_REQUIRE_SUDACHI
      # turns their skip into a failure in that job (ADR-039). Every other job runs them with the fake segmenter.
      - name: Install the [ja] extra (Linux, Python 3.11)
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: |
          pip install -e ".[ja]"
          echo "TRANSCRIPTION_REQUIRE_SUDACHI=1" >> "$GITHUB_ENV"
      - run: python -m unittest -v tests/test_unit.py tests/test_security.py tests/test_paths.py tests/test_conformance.py tests/test_haas.py tests/test_version_source.py tests/test_speechcpp.py tests/test_whisperx.py tests/test_words.py tests/test_qwen3_asr.py tests/test_chunking.py tests/test_follow.py tests/test_search.py tests/test_speaker_conformance.py tests/test_vocab.py
      - name: Release-tooling scripts (the release decision, ADR-036)
        if: runner.os == 'Linux'
        run: python -m unittest discover -v -s scripts/release/tests
