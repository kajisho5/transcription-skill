[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-skill"
version = "0.11.2"
description = "Speech recognition skill: audio/video in, structured Transcript (segments, word timestamps, SpeechEvent candidates) out. Not a video editing agent."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "kajisho5"}]
keywords = ["transcription", "speech-recognition", "asr", "speech-to-text", "whisper", "faster-whisper", "timestamped-transcript", "offline-transcription", "agent-skill", "transcript", "speech-event", "video-production"]
dependencies = []

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0"]
# Japanese dictionary word segmentation (request word_segmentation "dictionary", ADR-039); never needed otherwise
ja = ["sudachipy>=0.6.8", "sudachidict_core>=20230927"]
# the optional qwen3_asr engine (ADR-041): Qwen3-ASR-1.7B + Qwen3-ForcedAligner-0.6B through qwen-asr (pulls PyTorch and
# transformers); the version the engine was written against. qwen-asr needs Python 3.10+, so on 3.9 this installs nothing
qwen3-asr = ["qwen-asr==0.0.6; python_version >= '3.10'"]

[project.scripts]
transcription = "transcription_skill.cli:main"

[project.urls]
Homepage = "https://github.com/kajisho5/transcription-skill"

[tool.setuptools.packages.find]
where = ["src"]
